<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="UTF-8">
	<title>Banana Hunter</title>
	<!-- A1: mobile viewport — fit device, block pinch/zoom -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="theme-color" content="#cdc8ff">
	<!-- B1/B4: PWA manifest + icons -->
	<link rel="manifest" href="manifest.json">
	<link rel="icon" href="icons/icon-192.png">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<style>
		/* A5: kill default touch behaviours (scroll, pinch-zoom, tap highlight, text select) */
		* { -webkit-tap-highlight-color: rgba(0,0,0,0); }
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			/* Letterbox/pillarbox split to match bground.png: sky color (#CDC8FF, the stable
			   sky shade from y=2 down — y=0 is a 1px anti-aliased edge, slightly darker and
			   visibly mismatched) above the centered canvas, road color (#595959) below it,
			   split at the vertical center since the canvas is always page-aligned to the
			   middle (pageAlignVertically). */
			background: linear-gradient(to bottom, #cdc8ff 0%, #cdc8ff 50%, #595959 50%, #595959 100%);
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#phaser-example { width: 100%; height: 100%; }
		canvas { display: block; margin: 0 auto; }
		/* Landscape only: show a rotate prompt and hide the game in portrait */
		#rotate {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #000;
			color: #fff000;
			font-family: Arial, sans-serif;
			font-size: 5vw;
			text-align: center;
			align-items: center;
			justify-content: center;
			z-index: 10;
		}
		@media (orientation: portrait) {
			#phaser-example { display: none; }
			#rotate { display: flex; }
		}
	</style>
	<script type="text/javascript" src="phaser.js"></script>
	<script type="text/javascript" src="mygame.js"></script>
	<script>
		// B4: register the service worker so the game is installable and works offline
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('sw.js').catch(function (err) {
					console.warn('Service worker registration failed:', err);
				});
			});
		}
	</script>
</head>
<body>
	<div id="phaser-example"></div>
	<div id="rotate">Please rotate your device to landscape</div>
</body>
</html>
