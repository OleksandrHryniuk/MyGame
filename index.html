<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="UTF-8">
	<title>Banana Hunter</title>
	<!-- A1: mobile viewport — fit device, block pinch/zoom -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="theme-color" content="#000000">
	<style>
		/* A5: kill default touch behaviours (scroll, pinch-zoom, tap highlight, text select) */
		* { -webkit-tap-highlight-color: rgba(0,0,0,0); }
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #000;
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#phaser-example { width: 100%; height: 100%; }
		canvas { display: block; margin: 0 auto; }
		/* Landscape only: show a rotate prompt and hide the game in portrait */
		#rotate {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #000;
			color: #fff000;
			font-family: Arial, sans-serif;
			font-size: 5vw;
			text-align: center;
			align-items: center;
			justify-content: center;
			z-index: 10;
		}
		@media (orientation: portrait) {
			#phaser-example { display: none; }
			#rotate { display: flex; }
		}
	</style>
	<script type="text/javascript" src="phaser.js"></script>
	<script type="text/javascript" src="mygame.js"></script>
</head>
<body>
	<div id="phaser-example"></div>
	<div id="rotate">Please rotate your device to landscape</div>
</body>
</html>
